name: Deploy hosted MCP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-mcp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: hosted-mcp-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm hosted-mcp:test
      - run: pnpm hosted-mcp:build
      - name: Deploy restricted worker
        run: pnpm --filter @tale-ui/hosted-mcp deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
