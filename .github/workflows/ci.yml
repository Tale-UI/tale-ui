name: CI

on:
  push:
    branches-ignore:
      - 'renovate/**'
      - 'dependabot/**'
  pull_request:

permissions: {}

jobs:
  # Lint and build the CSS design system
  check-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Verify generated tokens
        run: pnpm tokens:check
      - name: Test native token generation
        run: pnpm test:tokens
      - name: Lint CSS
        run: pnpm lint:css
      - name: Audit BEM classes
        run: pnpm audit:bem
      - name: Audit docs
        run: pnpm audit:docs
      - name: Audit brand tokens
        run: pnpm audit:brand
      - name: Audit component completeness
        run: pnpm audit:components
      - name: Audit coverage (ComponentAudit, Storybook, A2UI showcase)
        run: pnpm audit:coverage:check
      - name: Verify component registry
        run: pnpm registry:check
      - name: Verify roadmap contracts and unified registry
        run: pnpm roadmap:check
      - name: Verify cursor rules
        run: pnpm cursorrules:check
      - name: Audit snippet component kinds
        run: pnpm audit:snippet-kinds
      - name: Validate golden prompts
        run: pnpm golden:validate
      - name: Build CSS
        run: pnpm --filter @tale-ui/css build
      - name: Verify dist is up-to-date
        shell: bash
        run: |
          if ! git diff --quiet packages/css/dist/; then
            echo "dist/style.css is out of date. Run 'pnpm build:css' and commit the result."
            git diff --stat packages/css/dist/
            exit 1
          fi

  # TypeScript, ESLint, and unit tests
  check-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm typescript
      - name: Verify packed React package
        run: pnpm react:test:package
      - name: Verify packed Styles package
        run: pnpm --filter @tale-ui/react-styles test:package
      - name: Verify packed tooling API and CLI
        run: pnpm tooling:test:package
      - name: Verify renderer-neutral foundations
        run: pnpm foundations:test && pnpm foundations:test:package && pnpm --filter @tale-ui/themes generate:check && pnpm --filter @tale-ui/themes test && pnpm --filter @tale-ui/themes build && pnpm --filter @tale-ui/themes test:package
      - name: Verify React Native provider and overlays
        run: pnpm native:test:provider-overlays
      - name: Verify PR preflight logic and native implementation inventory
        run: pnpm native:pr19:preflight:test && pnpm native:surface:check
      - name: Verify React Native registry generation and identity
        run: pnpm native:registry:check
      - name: Verify React Native unit and package contracts
        run: pnpm native:test && pnpm native:test:package
      - name: Verify React Native conformance and coverage
        run: pnpm native:conformance:check && pnpm native:coverage:check
      - name: Verify React Native Storybook source, loader, types, and web build
        run: pnpm native:storybook:build
      - name: Verify packed Expo and plain React Native consumers
        run: pnpm native:test:consumers
      - name: Verify React Native documentation semantics
        run: pnpm native:docs:check
      - name: Verify general documentation and generated provenance
        run: pnpm docs:versions:check && pnpm markdownlint && pnpm generate-docs:check
      - name: Unit tests (jsdom)
        run: pnpm test:jsdom

  # Build consumer tarballs once on the release build runtime.
  build-packed-consumer-tarballs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build packed runtime packages
        run: |
          pnpm --filter @tale-ui/utils build
          pnpm --filter @tale-ui/react build
      - name: Pack consumer artifacts
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.artifacts/packed-consumers"
          pnpm --dir packages/css pack --pack-destination "$GITHUB_WORKSPACE/.artifacts/packed-consumers" --silent
          pnpm --dir packages/styles pack --pack-destination "$GITHUB_WORKSPACE/.artifacts/packed-consumers" --silent
          pnpm --dir packages/utils pack --pack-destination "$GITHUB_WORKSPACE/.artifacts/packed-consumers" --silent
          pnpm --dir packages/react pack --pack-destination "$GITHUB_WORKSPACE/.artifacts/packed-consumers" --silent
      - uses: actions/upload-artifact@v4
        with:
          name: gate-b-packed-consumers
          path: .artifacts/packed-consumers/*.tgz
          if-no-files-found: error

  # Exercise the Node/React consumer cross-product against Node-22-built tarballs.
  test-react-packed-consumer-matrix:
    needs: build-packed-consumer-tarballs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
        react: [17, 18, 19]
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js ${{ matrix.node }}.x
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: gate-b-packed-consumers
          path: .artifacts/packed-consumers
      - name: Verify packed React consumer
        env:
          TALE_PACKED_BUILD_NODE_MAJOR: 22
          TALE_PACKED_NODE_MAJOR: ${{ matrix.node }}
          TALE_PACKED_REACT_MAJOR: ${{ matrix.react }}
          TALE_PACKED_TARBALL_DIR: ${{ github.workspace }}/.artifacts/packed-consumers
        run: node packages/react/scripts/test-packed-consumers.mjs

  test-styles-packed-consumer-matrix:
    needs: build-packed-consumer-tarballs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js ${{ matrix.node }}.x
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: gate-b-packed-consumers
          path: .artifacts/packed-consumers
      - name: Verify packed Styles consumer
        env:
          TALE_PACKED_BUILD_NODE_MAJOR: 22
          TALE_PACKED_NODE_MAJOR: ${{ matrix.node }}
          TALE_PACKED_TARBALL_DIR: ${{ github.workspace }}/.artifacts/packed-consumers
        run: node packages/styles/scripts/test-packed-consumers.mjs

  test-react-node16-rejection:
    needs: build-packed-consumer-tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 16.x
        uses: actions/setup-node@v4
        with:
          node-version: '16'
      - uses: actions/download-artifact@v4
        with:
          name: gate-b-packed-consumers
          path: .artifacts/packed-consumers
      - name: Locate React tarball
        shell: bash
        run: |
          REACT_TARBALL="$(find "$GITHUB_WORKSPACE/.artifacts/packed-consumers" -name 'tale-ui-react-[0-9]*.tgz' -print -quit)"
          test -n "$REACT_TARBALL"
          echo "TALE_REACT_TARBALL=$REACT_TARBALL" >> "$GITHUB_ENV"
      - name: Verify Node 16 engine-strict rejection
        run: node packages/react/scripts/test-engine-compatibility.mjs --expect-node-16-rejection

  # Changed-component accessibility and maintained performance budgets
  check-accessibility-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install accessibility browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke-test axe runner
        run: pnpm a11y:smoke
      - name: Check performance fixture contracts
        run: pnpm performance:fixtures:check
      - name: Build accessibility Storybook
        run: pnpm -C playground/storybook build --output-dir ../../.artifacts/storybook-a11y
      - name: Check changed components with axe
        env:
          A11Y_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm exec concurrently --success first --kill-others "pnpm exec serve .artifacts/storybook-a11y --listen 6007 --no-request-logging --no-clipboard" "pnpm a11y:changed -- --url http://127.0.0.1:6007 --base $A11Y_BASE"
      - name: Check performance budgets
        run: pnpm performance:check
      - name: Retain accessibility and performance trends
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-performance-${{ github.run_id }}
          path: |
            .artifacts/accessibility-current.json
            .artifacts/performance-current.json
          if-no-files-found: warn
          retention-days: 30

  # A2UI catalog drift prevention
  check-a2ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Verify A2UI catalog docs
        run: pnpm a2ui:check-docs
      - name: Validate A2UI examples
        run: pnpm a2ui:validate-examples
      - name: Audit A2UI docs
        run: pnpm a2ui:audit-docs
      - name: Verify A2UI catalog registry
        run: pnpm a2ui:check-catalog

  # Markdown lint and formatting
  check-formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Audit documentation semantics
        run: pnpm audit:docs:semantics
      - name: Markdown lint
        run: pnpm markdownlint
      - name: Prettier
        run: pnpm prettier

  # Tests dev-only scripts across all supported dev environments
  test-dev:
    if: ${{ github.actor != 'l10nbot' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - run: echo "${{ github.actor }}"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - name: Use Node.js 22.x
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22.18'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm release:build
