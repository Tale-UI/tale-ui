name: CI

on:
  push:
    branches-ignore:
      - 'renovate/**'
      - 'dependabot/**'
  pull_request:

permissions: {}

jobs:
  # Lint and build the CSS design system
  check-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Verify generated tokens
        run: pnpm tokens:check
      - name: Test native token generation
        run: pnpm test:tokens
      - name: Lint CSS
        run: pnpm lint:css
      - name: Audit BEM classes
        run: pnpm audit:bem
      - name: Audit docs
        run: pnpm audit:docs
      - name: Audit brand tokens
        run: pnpm audit:brand
      - name: Audit component completeness
        run: pnpm audit:components
      - name: Audit coverage (ComponentAudit, Storybook, A2UI showcase)
        run: pnpm audit:coverage:check
      - name: Verify component registry
        run: pnpm registry:check
      - name: Verify roadmap contracts and unified registry
        run: pnpm roadmap:check
      - name: Verify cursor rules
        run: pnpm cursorrules:check
      - name: Audit snippet component kinds
        run: pnpm audit:snippet-kinds
      - name: Validate golden prompts
        run: pnpm golden:validate
      - name: Build CSS
        run: pnpm --filter @tale-ui/css build
      - name: Verify dist is up-to-date
        shell: bash
        run: |
          if ! git diff --quiet packages/css/dist/; then
            echo "dist/style.css is out of date. Run 'pnpm build:css' and commit the result."
            git diff --stat packages/css/dist/
            exit 1
          fi

  # TypeScript, ESLint, and unit tests
  check-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm typescript
      - name: Verify packed tooling API and CLI
        run: pnpm tooling:test:package
      - name: Unit tests (jsdom)
        run: pnpm test:jsdom

  # Changed-component accessibility and maintained performance budgets
  check-accessibility-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install accessibility browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke-test axe runner
        run: pnpm a11y:smoke
      - name: Build accessibility Storybook
        run: pnpm -C playground/storybook build --output-dir ../../.artifacts/storybook-a11y
      - name: Check changed components with axe
        env:
          A11Y_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm exec concurrently --success first --kill-others "pnpm exec serve .artifacts/storybook-a11y --listen 6007 --no-request-logging --no-clipboard" "pnpm a11y:changed -- --url http://127.0.0.1:6007 --base $A11Y_BASE"
      - name: Check performance budgets
        run: pnpm performance:check
      - name: Retain accessibility and performance trends
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-performance-${{ github.run_id }}
          path: |
            .artifacts/accessibility-current.json
            .artifacts/performance-current.json
          if-no-files-found: warn
          retention-days: 30

  # A2UI catalog drift prevention
  check-a2ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Verify A2UI catalog docs
        run: pnpm a2ui:check-docs
      - name: Validate A2UI examples
        run: pnpm a2ui:validate-examples
      - name: Audit A2UI docs
        run: pnpm a2ui:audit-docs
      - name: Verify A2UI catalog registry
        run: pnpm a2ui:check-catalog

  # Markdown lint and formatting
  check-formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Markdown lint
        run: pnpm markdownlint
      - name: Prettier
        run: pnpm prettier

  # Tests dev-only scripts across all supported dev environments
  test-dev:
    if: ${{ github.actor != 'l10nbot' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - run: echo "${{ github.actor }}"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - name: Use Node.js 22.x
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22.18'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm release:build
